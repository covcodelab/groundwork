  - id: census-2021-ew-households
    dataset: census-2021-ew
    title: Census 2021 household estimates, England and Wales
    publisher: Office for National Statistics
    country: ew
    url: https://www.ons.gov.uk/census
    description: Household counts and composition by small area. The default denominator for dwelling-fire rates.
    keywords: [census, households, denominator, population]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa21
    key: LSOA21CD
    join_via: direct
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "2021-03-21"
    update_cadence: decennial
    superseded_by: null
    caveats:
      - "A single-date snapshot used as the denominator for a multi-year incident window degrades the further you get from 2021, and degrades unevenly — new estates are where it is worst, and they are places you care about."
      - "LSOA21 only. Does not join to IMD 2019 without conversion."
    see_also: [voa-dwellings-by-build-period, ons-mid-year-population-estimates]
    status: draft
    entry_added: 2026-09-17

