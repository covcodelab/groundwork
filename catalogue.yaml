  - id: lsoa-2021-boundaries-ew
    dataset: ons-lsoa-boundaries
    title: LSOA (2021) boundaries, England and Wales
    publisher: ONS Open Geography Portal
    country: ew
    url: https://geoportal.statistics.gov.uk/
    description: Current LSOA polygons. 33,755 in England, 1,917 in Wales.
    keywords: [boundaries, lsoa, geography, polygons]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa21
    key: LSOA21CD
    join_via: direct
    geometry: polygon
    crs: EPSG:27700
    formats: [geopackage, shapefile, geojson]
    reference_period: "2021"
    update_cadence: decennial
    supersedes: lsoa-2011-boundaries-ew
    superseded_by: null
    caveats:
      - "Published in several generalisation levels. Use full resolution for analysis and a generalised version for display — mixing them produces area calculations that disagree with the map."
      - "Counts verified against ONS Census 2021 geographies guidance, 17 Sep 2026."
    see_also: [lsoa-2011-to-2021-lookup]
    status: draft
    entry_added: 2026-09-17

  - id: lsoa-2011-boundaries-ew
    dataset: ons-lsoa-boundaries
    title: LSOA (2011) boundaries, England and Wales
    publisher: ONS Open Geography Portal
    country: ew
    url: https://geoportal.statistics.gov.uk/
    description: Previous LSOA polygons. Needed for anything published on LSOA11, including IMD 2019.
    keywords: [boundaries, lsoa, geography, 2011]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa11
    key: LSOA11CD
    join_via: direct
    geometry: polygon
    crs: EPSG:27700
    formats: [geopackage, shapefile, geojson]
    reference_period: "2011"
    update_cadence: static
    supersedes: null
    superseded_by: lsoa-2021-boundaries-ew
    caveats:
      - "Frozen — these will not change again. Anything coded to LSOA11 joins here and only here."
      - "Still the right boundary file for IMD 2019, IMD 2015 and Home Office fire statistics coded to LSOA11. Superseded does not mean obsolete."
    see_also: [lsoa-2011-to-2021-lookup, imd-2019]
    status: draft
    entry_added: 2026-09-17

  - id: lsoa-2011-to-2021-lookup
    dataset: ons-geography-lookups
    title: LSOA (2011) to LSOA (2021) to LAD (2022) exact fit lookup, England and Wales
    publisher: ONS Open Geography Portal
    country: ew
    url: https://www.data.gov.uk/dataset/03a52a27-36e7-4f33-a632-83282faea36f/lsoa-2011-to-lsoa-2021-to-local-authority-district-2022-exact-fit-lookup-for-ew-v3
    description: The bridge between boundary generations, carrying a change indicator per LSOA.
    keywords: [lookup, lsoa, boundary change, conversion, crosswalk]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: both
    key: [LSOA11CD, LSOA21CD]
    join_via: direct
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "2021"
    update_cadence: static
    caveats:
      - "Around 6% of LSOAs changed between 2011 and 2021 through splits and merges. The change indicator distinguishes unchanged, split, merged and irregular cases — read the code values from the lookup itself rather than assuming them."
      - "Split: a parent value may be inherited by children for a rate, never for a count. Merged: children combine with a denominator weight, never a plain average. Irregular: flag and exclude from strict comparison."
      - "A best-fit variant also exists. Exact fit and best fit are different products — know which you have."
    see_also: [lsoa-2021-boundaries-ew, lsoa-2011-boundaries-ew]
    status: draft
    entry_added: 2026-09-17

  - id: onspd
    dataset: ons-postcode-products
    title: ONS Postcode Directory
    publisher: ONS Open Geography Portal
    country: uk
    url: https://geoportal.statistics.gov.uk/
    description: Postcode to statistical geography lookup, with coordinates.
    keywords: [postcode, lookup, onspd, nspl, geography]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: postcode
    boundary_vintage: lsoa21
    key: pcds
    join_via: postcode-lookup
    geometry: point
    crs: EPSG:27700
    formats: [csv]
    reference_period: "quarterly release"
    update_cadence: quarterly
    caveats:
      - "Released quarterly, and a postcode's LSOA assignment can change between releases. Stamp which release was used — an unstamped postcode join is unreproducible."
      - "Postcode-mediated joins are second best. Prefer UPRN where you have it."
      - "NSPL is a closely related product with different geography assignment rules. They are not interchangeable."
    see_also: [os-open-uprn, os-addressbase-plus]
    status: draft
    entry_added: 2026-09-17

  - id: rural-urban-classification-2021
    dataset: ons-rural-urban-classification
    title: Rural Urban Classification 2021
    publisher: Office for National Statistics / Defra
    country: ew
    url: https://www.gov.uk/government/collections/rural-urban-classification
    description: Settlement type per small area. A standard covariate and a standard way to stratify comparisons.
    keywords: [rural, urban, classification, settlement, covariate]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa21
    key: LSOA21CD
    join_via: direct
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "2021"
    update_cadence: decennial
    caveats:
      - "Earlier versions are published on LSOA11. Confirm the vintage of the release you have."
      - "Response times and risk profiles differ sharply by rurality — stratifying by this is usually more honest than controlling for it."
    status: draft
    entry_added: 2026-09-17

  - id: fra-boundaries-ew
    dataset: ons-administrative-boundaries
    title: Fire and Rescue Authority boundaries
    publisher: ONS Open Geography Portal
    country: ew
    url: https://geoportal.statistics.gov.uk/
