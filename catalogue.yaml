  # ---------------------------------------------------------------------

  - id: fire-incidents-published
    dataset: home-office-fire-statistics
    title: Fire statistics — incident level datasets
    publisher: Home Office
    country: england
    url: https://www.gov.uk/government/statistics/fire-statistics-incident-level-datasets
    description: Published incident records derived from IRS. The open outcome data.
    keywords: [incidents, fire, irs, outcomes, home office, dwelling fires]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa11
    key: LSOA code
    join_via: direct
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "2010/11 onwards"
    update_cadence: annual
    caveats:
      - "Published extracts, not your own IRS. Address-level incident locations are personal data and are not in here."
      - "A 15-year pooling window spans three LSOA generations and four deprivation releases. Confirm which boundary generation each year is coded to before pooling."
      - "Dwelling fires are rare. At LSOA level over one year you are working with counts of zero, one and two, where the apparent rate is dominated by noise."
    see_also: [imd-2025, census-2021-ew-households]
    status: draft
    entry_added: 2026-09-17

  - id: acorn-household
    dataset: caci-acorn
    title: CACI Household Acorn
    publisher: CACI
    country: uk
    url: https://www.caci.co.uk/datasets/household-acorn/
    description: Commercial geodemographic segmentation at household level.
    keywords: [acorn, geodemographic, segmentation, caci, household]
    licence: commercial
    tier: licensed
    redistribution: check-contract
    requires_agreement: >
      Commercial contract. Free to UK police forces and fire and rescue services
      under CACI's Police & Fire Data Initiative, subject to contract —
      https://info.caci.co.uk/police-and-fire-data-initiative
    access: request
    grain: uprn
    boundary_vintage: uprn
    key: UPRN
    join_via: gazetteer
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "build version"
    update_cadence: irregular
    caveats:
      - "Periodically rebuilt. A household's Acorn type is not stable across builds, so a rebuild silently changes any model predictor derived from it. Record the build version."
      - "Redistribution is the clause that matters. Establish whether a derived band may reach a browser, or a partner, before designing anything that assumes it can."
      - "Acorn describes areas and types, not households. Inferring a household attribute from an Acorn average — as the Hertfordshire model does for smoking — is a documented simplification, not a measurement."
      - "Cannot appear in any open demonstration dataset."
    status: draft
    entry_added: 2026-09-17

