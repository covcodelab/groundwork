  - id: os-open-uprn
    dataset: os-open-data
    title: OS Open UPRN
    publisher: Ordnance Survey
    country: gb
    url: https://www.ordnancesurvey.co.uk/products/os-open-uprn
    description: Every UPRN in Great Britain with a coordinate. Open, and often overlooked.
    keywords: [uprn, address, property, gazetteer, open]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: uprn
    boundary_vintage: uprn
    key: UPRN
    join_via: direct
    geometry: point
    crs: EPSG:27700
    formats: [csv, geopackage]
    reference_period: "current"
    update_cadence: quarterly
    caveats:
      - "Coordinates and identifiers only — no address text, no classification. For property type or address matching you need AddressBase Plus."
      - "Being open, this is the cheapest way to get a UPRN spine for a service that has no PSGA route."
    see_also: [os-addressbase-plus]
    status: draft
    entry_added: 2026-09-17

  - id: os-addressbase-plus
    dataset: os-addressbase
    title: OS AddressBase Plus
    publisher: Ordnance Survey
    country: gb
    url: https://www.ordnancesurvey.co.uk/products/os-addressbase-plus
    description: The full address gazetteer with classification. The join spine for property-level work.
    keywords: [addressbase, uprn, gazetteer, address, classification]
    licence: PSGA
    tier: licensed
    redistribution: derived-only
    requires_agreement: Public Sector Geospatial Agreement membership
    access: download
    grain: uprn
    boundary_vintage: uprn
    key: UPRN
    join_via: direct
    geometry: point
    crs: EPSG:27700
    formats: [csv, geopackage]
    reference_period: "six-weekly epoch"
    update_cadence: six-weekly
    caveats:
      - "The match rate achieved against this is the ceiling on everything built above it. Publish it as a metric, not a footnote."
      - "Derived outputs are generally publishable under PSGA; the raw gazetteer is not. Check your own terms before any derived coordinate reaches a browser."
      - "Classification codes drive the ORH/NFCC property-type methodology — they map to 23 standardised categories in that work."
    see_also: [os-open-uprn]
    status: draft
    entry_added: 2026-09-17

  - id: epc-domestic-ew
    dataset: energy-performance-certificates
    title: Energy Performance of Buildings — domestic certificates
    publisher: Ministry of Housing, Communities and Local Government
    country: ew
    url: https://epc.opendatacommunities.org/
    description: Lodged EPCs with dwelling characteristics. A property-level covariate source with a large asterisk.
    keywords: [epc, energy, dwelling type, property, building]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: api
    grain: uprn
    boundary_vintage: uprn
    key: UPRN
    join_via: gazetteer
    geometry: none
    crs: null
    formats: [csv, api]
    reference_period: "lodgement date per certificate"
    update_cadence: continuous
    caveats:
      - "A lodgement register, not a survey. A dwelling appears only if a certificate was lodged, and its data is as-of that lodgement, not today."
      - "Coverage is NOT missing at random — recently sold and rented properties are over-represented, which correlates with tenure, which correlates with risk. Treat EPC-derived dwelling type as partially observed, and report coverage by tenure and property type."
      - "UPRN is present on many but not all records. Expect to match the remainder through the gazetteer."
    see_also: [os-addressbase-plus]
    status: draft
    entry_added: 2026-09-17

