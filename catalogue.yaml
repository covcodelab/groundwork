      - "OHID publish versions adjusted onto later boundaries. Prefer those to a bespoke conversion — they are citable."
    not_comparable_with:
      - { id: imd-2025, reason: "Different boundary generation, indicators and shrinkage method." }
    see_also: [lsoa-2011-boundaries-ew, lsoa-2011-to-2021-lookup]
    status: draft
    entry_added: 2026-09-17

