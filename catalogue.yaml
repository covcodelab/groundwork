# Source catalogue — draft v0.1
#
# Twenty entries covering the working set for UK fire and rescue risk analysis.
# Every entry is status: draft — the shape is considered, the facts need
# checking against the publisher before anyone relies on them.
#
# Facts verified 17 Sep 2026 are marked in the caveats. Everything else is
# drafted from working knowledge and needs confirming.

version: 1

sources:

  # ---------------------------------------------------------------------
  # Deprivation — four nations, four indices, none comparable with another
  # ---------------------------------------------------------------------

  - id: imd-2025
    dataset: english-indices-of-deprivation
    title: English Indices of Deprivation 2025
    publisher: Ministry of Housing, Communities and Local Government
    country: england
    url: https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025
    description: Relative deprivation for small areas in England, overall index and seven domains.
    keywords: [deprivation, imd, iod, poverty, index]
    licence: OGL-UK-3.0
    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa21
    key: LSOA21CD
    join_via: direct
    geometry: none
    crs: null
    formats: [xlsx, csv]
    reference_period: "2021–2024"
    reference_period_note: >
      No single reference date. Benefits data March 2024, employment 2022/23
      financial year, census-derived indicators 2021.
    update_cadence: irregular
    supersedes: imd-2019
    superseded_by: null
    caveats:
      - "Not directly comparable with IoD2019 or earlier: 20 new indicators, 14 substantially modified, and a changed shrinkage methodology (area classification rather than local authority means). Verified against the ID2025 technical report, 17 Sep 2026."
      - "First release on LSOA21. Joining to anything on LSOA11 requires an explicit conversion."
      - "Ranks and deciles are ordinal. Never area-weight them across a boundary change — convert scores if you must convert at all, and prefer OHID's published boundary-adjusted versions."
    not_comparable_with:
      - { id: imd-2019, reason: "Different boundary generation, indicators and shrinkage method; officially 'less directly comparable'." }
      - { id: wimd-2025, reason: "Separately constructed national index. Cross-border comparison is meaningless." }
      - { id: simd-2020, reason: "Separately constructed national index." }
      - { id: nimdm-2017, reason: "Separately constructed national index." }
    see_also: [lsoa-2021-boundaries-ew, census-2021-ew-households]
    status: draft
    entry_added: 2026-09-17

  - id: imd-2019
    dataset: english-indices-of-deprivation
