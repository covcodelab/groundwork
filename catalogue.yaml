    tier: open
    redistribution: attribution
    access: download
    grain: lsoa
    boundary_vintage: lsoa11
    key: LSOA11CD
    join_via: direct
    geometry: none
    crs: null
    formats: [csv]
    reference_period: "annual snapshot"
    update_cadence: annual
    caveats:
      - "Often the better dwelling denominator than the census for inter-censal years, because it is annual."
      - "Boundary vintage varies by release and older releases are LSOA11. Verify per release — stated here as lsoa11 and NOT verified for the current one."
      - "Build period is a genuine fire-risk covariate and is otherwise hard to obtain at area level."
    see_also: [census-2021-ew-households]
    status: draft
    entry_added: 2026-09-17

