[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "groundwork-uk"
version = "0.1.0.dev0"
description = "Find, acquire and prepare UK public geodata — a catalogue that carries the vintage and join knowledge, and the tools that check it"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CovCodeLab contributors" }]
keywords = ["gis", "uk", "open-data", "catalogue", "geoparquet", "epsg27700", "lsoa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
catcheck = "groundwork.catalogue.cli:main"

[project.urls]
Repository = "https://github.com/covcodelab/groundwork"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv.build-backend]
module-name = "groundwork"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
